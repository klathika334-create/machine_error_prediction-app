<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Error Prediction Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body style="margin:0; padding:0; background: #181824; color: #fff; font-family: 'Segoe UI',sans-serif;">
    <div style="display: flex; min-height: 100vh;">
        <nav style="width: 220px; background: rgba(30,30,40,0.95); box-shadow: 2px 0 16px 0 rgba(31,38,135,0.17); display: flex; flex-direction: column; align-items: flex-start; padding: 2rem 1rem 1rem 1.5rem;">
            <div style="margin-bottom: 2rem;">
                <div style="font-size: 1.2rem; font-weight: 600; color: #22d3ee;">👤 {{ username }}</div>
            </div>
            <button onclick="location.href='/'" style="width: 100%; margin-bottom: 1rem; padding: 0.7rem 1rem; border: none; border-radius: 0.7rem; background: #23233b; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.2s;">Charts</button>
            <button onclick="location.href='/information'" style="width: 100%; margin-bottom: 1rem; padding: 0.7rem 1rem; border: none; border-radius: 0.7rem; background: #23233b; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.2s;">Information</button>
            <button onclick="location.href='/prediction-details'" style="width: 100%; margin-bottom: 1rem; padding: 0.7rem 1rem; border: none; border-radius: 0.7rem; background: #23233b; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.2s;">Prediction Details</button>
            {% if session['role'] in ['admin', 'owner'] %}
            <button onclick="location.href='/users'" style="width: 100%; margin-bottom: 1rem; padding: 0.7rem 1rem; border: none; border-radius: 0.7rem; background: #23233b; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.2s;">Users</button>
            {% endif %}
            <button onclick="location.href='/logout'" style="width: 100%; margin-top: auto; padding: 0.7rem 1rem; border: none; border-radius: 0.7rem; background: #ef4444; color: #fff; font-size: 1rem; cursor: pointer;">Logout</button>
        </nav>
        <main style="flex:1; padding: 2rem;">
            <h1 style="margin-top:0;">Machine Error Prediction Dashboard</h1>
            <p>Welcome to the real-time monitoring and prediction dashboard.</p>
            <div id="dashboard-content">
                <div class="charts-wrapper" style="display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: flex-start; align-items: flex-start; max-height: 70vh; overflow-y: auto; padding-right: 1rem;">
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Voltage (V)</h3><canvas id="voltageChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Current (A)</h3><canvas id="currentChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Power (kW)</h3><canvas id="powerChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Temperature (°C)</h3><canvas id="temperatureChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Vibration (mm/s)</h3><canvas id="vibrationChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Speed (RPM)</h3><canvas id="speedChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Slip</h3><canvas id="slipChart" height="120" width="220"></canvas></div>
                    <div class="chart-container" style="flex: 0 0 30%; min-width: 220px; max-width: 32%; background: rgba(40,40,60,0.85); border-radius: 1.2rem; padding: 0.7rem; margin-bottom: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.17);"><h3>Power Factor</h3><canvas id="powerFactorChart" height="120" width="220"></canvas></div>
                </div>
                <div style="margin-top: 2rem; text-align: center;">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
                        <span style="display: inline-block; background: #ef4444; color: #fff; border-radius: 50%; width: 2.5rem; height: 2.5rem; line-height: 2.5rem; font-size: 2rem; box-shadow: 0 0 12px #ef4444aa;">&#9888;</span>
                        <h2 style="margin: 0; color: #fff;">Fault:</h2>
                        <div id="live-issue" style="font-size: 1.5rem; color: #ef4444; font-weight: bold;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    async function fetchDataAndRender() {
        const res = await fetch('/api/random-data');
        const data = await res.json();
        if (!data || data.length === 0) return;
        const labels = data.map((row, i) => row['Time'] || `#${i+1}`);
        const voltage = data.map(row => row['Voltage (V)']);
        const current = data.map(row => row['Current (A)']);
        const power = data.map(row => row['Power (kW)']);
        const temp = data.map(row => row['Temperature (°C)']);
        const vibration = data.map(row => row['Vibration (mm/s)']);
        const speed = data.map(row => row['Speed (RPM)']);
        const slip = data.map(row => row['Slip']);
        const powerFactor = data.map(row => row['Power Factor']);
        document.getElementById('live-issue').textContent = data[data.length-1]['Combination'] || 'No issue';
        function makeChart(canvasId, label, chartData, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: label,
                        data: chartData,
                        borderColor: color,
                        backgroundColor: color + '22',
                        tension: 0.4,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#fff' } },
                        title: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#a3a3a3' } },
                        y: { ticks: { color: '#a3a3a3' } }
                    }
                }
            });
        }
        makeChart('voltageChart', 'Voltage (V)', voltage, 'rgba(255,99,132,1)');
        makeChart('currentChart', 'Current (A)', current, 'rgba(54,162,235,1)');
        makeChart('powerChart', 'Power (kW)', power, 'rgba(255,206,86,1)');
        makeChart('temperatureChart', 'Temperature (°C)', temp, 'rgba(75,192,192,1)');
        makeChart('vibrationChart', 'Vibration (mm/s)', vibration, 'rgba(153,102,255,1)');
        makeChart('speedChart', 'Speed (RPM)', speed, 'rgba(255,159,64,1)');
        makeChart('slipChart', 'Slip', slip, 'rgba(255,99,71,1)');
        makeChart('powerFactorChart', 'Power Factor', powerFactor, 'rgba(100,255,218,1)');
    }
    fetchDataAndRender();
    </script>
</body>
</html>
