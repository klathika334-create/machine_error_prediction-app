<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | AURISPOWER</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e, #050508);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
        }

        .intro-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Wires */
        .wire {
            position: absolute;
            top: 50%;
            width: 50vw;
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan));
            border-radius: 10px;
            box-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-purple);
            transform: translateY(-50%);
            animation: connectWire 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .wire.left {
            left: -50vw;
            background: linear-gradient(90deg, transparent, var(--accent-cyan));
            transform-origin: right center;
        }

        .wire.right {
            right: -50vw;
            background: linear-gradient(270deg, transparent, var(--accent-purple));
            box-shadow: 0 0 15px var(--accent-purple), 0 0 30px var(--accent-cyan);
            transform-origin: left center;
        }

        @keyframes connectWire {
            0% { width: 0; }
            50% { width: 50vw; }
            100% { width: 50vw; opacity: 0; }
        }

        /* Flash / Joining effect */
        .flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 40px #fff, 0 0 80px var(--accent-cyan), 0 0 120px var(--accent-purple);
            animation: flashJoin 1.5s 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            opacity: 0;
            z-index: 5;
        }

        @keyframes flashJoin {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.1); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(15); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(40); }
        }

        /* Brand Text */
        .brand-reveal {
            position: absolute;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.5);
            animation: textReveal 2s 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            z-index: 20;
            text-align: center;
            text-shadow: 0 10px 30px rgba(34, 211, 238, 0.4);
        }

        @keyframes textReveal {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); filter: blur(10px); }
            50% { filter: blur(0px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        /* Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            animation: particleFly 1s 1.2s ease-out forwards;
        }

        @keyframes particleFly {
            0% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <!-- 1. The Wires -->
        <div class="wire left" style="animation-delay: 0.1s"></div>
        <div class="wire right" style="animation-delay: 0.1s"></div>

        <!-- 2. The Joining Flash -->
        <div class="flash"></div>

        <!-- 3. The Text -->
        <div class="brand-reveal">AURISPOWER</div>
    </div>

    <script>
        // Generate connection particles
        const container = document.querySelector('.intro-container');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random direction and distance
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 200;
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            particle.style.setProperty('--tx', tx);
            particle.style.setProperty('--ty', ty);
            
            // Random size and color
            const size = 2 + Math.random() * 6 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            
            if(Math.random() > 0.5) {
                particle.style.boxShadow = '0 0 10px var(--accent-cyan)';
                particle.style.background = 'var(--accent-cyan)';
            } else {
                particle.style.boxShadow = '0 0 10px var(--accent-purple)';
                particle.style.background = 'var(--accent-purple)';
            }

            particle.style.top = '50%';
            particle.style.left = '50%';
            
            container.appendChild(particle);
        }

        // Redirect to login after the animation sequence
        setTimeout(() => {
            window.location.href = "{{ url_for('login') }}";
        }, 4500); // 4.5 seconds gives enough time for wires (1.5s) + flash (1.5s) + text reveal (2s)
    </script>
</body>
</html>
